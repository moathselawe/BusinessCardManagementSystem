<div class="container my-4h" style="margin-top:20px;">

  <div class="row">

    <!-- 🔵 SKELETON -->
    <ng-container *ngIf="isLoading; else dataBlock">
      <div class="col-12" *ngFor="let i of [1,2,3]">
        <div class="card shadow border-0 rounded-4 mb-3">
          <div class="card-body">

            <p-skeleton width="40%" height="18px" class="mb-2"></p-skeleton>

            <p-skeleton width="100%" height="12px" class="mb-1"></p-skeleton>
            <p-skeleton width="90%" height="12px" class="mb-1"></p-skeleton>
            <p-skeleton width="95%" height="12px"></p-skeleton>

          </div>
        </div>
      </div>
    </ng-container>

    <!-- 🟢 REAL DATA -->
    <ng-template #dataBlock>
      <div class="col-12" *ngFor="let card of aboutUsList">
        <div class="card shadow border-0 rounded-4 mb-3">
          <div class="card-body">

            <h6 class="fw-semibold fs-sm mb-2"
                style="color: var(--primary-color);">
              {{ card.title }}
            </h6>

            <p class="fs-xs-2 text-neutral-500">
              {{ card.description }}
            </p>

          </div>
        </div>
      </div>
    </ng-template>

  </div>
</div>
