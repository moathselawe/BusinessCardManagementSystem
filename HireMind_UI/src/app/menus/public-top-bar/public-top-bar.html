<app-template-top-bar [items]="items">

  <!-- START -->
  <div topbar-start class="flex items-center gap-2">
    <div class="menu-header">
      <div class="logo">
        <i class="pi pi-box"></i>
        <span class="system-header">HireMind</span>
      </div>
    </div>
  </div>

  <!-- END -->
  <div topbar-end class="flex items-center gap-2 topbar-links">

    <!-- Language -->
    <span class="topbar-link" style="border: 1px solid var(--primary-color);"
          (click)="toggleLanguage()">
      {{ currentLang === 'en' ? 'AR' : 'EN' }}
      <i class="pi pi-globe"></i>
    </span>

    <!-- Login -->
    <span class="topbar-link topbar-login"
          routerLink="/login">
      <i class="pi pi-sign-in"></i>
      Login
    </span>

  </div>

</app-template-top-bar>
