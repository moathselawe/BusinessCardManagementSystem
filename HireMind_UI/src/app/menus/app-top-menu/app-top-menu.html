<p-menubar [model]="items" class="topbar">

  <!-- LEFT LOGO -->
  <ng-template pTemplate="start">
    <button pButton
            icon="pi pi-bars"
            class="p-button-text"
            (click)="toggleSidebar.emit()">
    </button>
    <div class="logo">
      <span>HireMind</span>
    </div>
  </ng-template>

  <!-- RIGHT SIDE -->
  <ng-template pTemplate="end">
    <div class="flex items-center gap-3">

      <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
                shape="circle">
      </p-avatar>

    </div>
  </ng-template>

</p-menubar>
