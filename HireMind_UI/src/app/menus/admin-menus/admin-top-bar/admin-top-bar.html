<app-template-top-bar [items]="items">

  <!-- START -->
  <div topbar-start class="topbar-start" >
    <!-- Sidebar Toggle -->
    <div class="sidebar-btn" (click)="toggleSidebar.emit()">
      <i class="pi"
         [ngClass]="sidebarCollapsed ? 'pi pi-chevron-right' : 'pi pi-chevron-left'">
      </i>
    </div>

    <div class="page-indicator">
      <i [class]="selectedIcon" class="page-icon"></i>
      <span>{{ selectedLabel }}</span>
    </div>
  </div>

  <!-- END -->
  <div topbar-end class="topbar-actions">

    <!-- Language -->
    <div class="action-btn" (click)="toggleLanguage()">
      <i class="pi pi-globe"></i>
      <span>{{ currentLang === 'en' ? 'AR' : 'EN' }}</span>
    </div>

    <!-- Dark Mode -->
    <div class="action-btn" (click)="toggleDarkMode()">
      <i class="{{isDark ? 'pi pi-sun' : 'pi pi-moon'}}"></i>
    </div>

    <!-- Theme -->
    <div class="action-btn" (click)="op.toggle($event)">
      <i class="pi pi-palette"></i>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Avatar -->
    <div class="avatar-wrapper" (click)="menu.toggle($event)">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200"
           class="user-avatar">
    </div>

    <p-menu #menu [popup]="true" [model]="profileItems"></p-menu>

    <!-- Colors -->
    <p-popover #op>
      <div class="color-picker">
        <button *ngFor="let c of colors"
                class="color-swatch"
                [style.background]="colorMap[c]"
                (click)="selectColor(c)">
        </button>
      </div>
    </p-popover>

  </div>

</app-template-top-bar>
