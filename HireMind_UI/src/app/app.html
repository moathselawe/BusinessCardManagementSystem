<toast-message></toast-message>

<router-outlet />

<div class="floating-btn"
     cdkDrag
     cdkDragBoundary="body"
     (cdkDragStarted)="isDragging = true"
     (cdkDragEnded)="isDragging = false">

  <p-button (onClick)="handleClick()"
            icon="pi pi-microchip-ai"
            severity="info"
            styleClass="p-button-rounded p-button-lg"
            [pTooltip]="'AI Assistant'">
  </p-button>

</div>

<p-dialog [(visible)]="visible"
          [modal]="false"
          [draggable]="false"
          [resizable]="false"
          appendTo="body"
          [position]="'bottomright'"
          [closable]="false"
          [style]="{ width: '25rem', height: '39rem' }">


  <app-template-conversation [title]="'AI Assistant'"
                             [messages]="aiMessages"
                             (messageSent)="onAiMessage($event)"
                             (closed)="visible = false">
  </app-template-conversation>

</p-dialog>
